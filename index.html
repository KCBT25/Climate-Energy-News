<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기후·에너지 뉴스 클리핑</title>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #1e4a3c; margin-bottom: 5px; font-size: 22px; line-height: 1.3; }
        .update-time { font-size: 13px; color: #666; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        /* 🔍 검색창 & 새로고침 영역 스타일 */
        .search-container { display: flex; gap: 8px; margin-bottom: 20px; background: white; padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .search-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; }
        .search-input:focus { border-color: #1e4a3c; }
        .action-btn { background: #1e4a3c; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .action-btn:hover { background: #15362c; }
        .refresh-btn { background: #607d8b; }

        /* 그룹 필터 버튼 스타일 */
        .filter-container { display: flex; gap: 8px; margin-bottom: 20px; padding-bottom: 10px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-btn { background: #e0e7e4; border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; color: #333; font-weight: 500; }
        .filter-btn.active { background: #1e4a3c; color: white; font-weight: bold; }
        
        /* 기사 리스트 스타일 */
        .news-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-decoration: none; display: block; color: inherit; transition: transform 0.2s; }
        .news-card:active { transform: scale(0.98); }
        .source-badge { font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; margin-bottom: 8px; display: inline-block; }
        
        .badge-jeju { background-color: #e3f2fd; color: #1976d2; }
        .badge-national { background-color: #fce4ec; color: #c2185b; }
        .badge-other { background-color: #f5f5f5; color: #616161; }
        
        .news-title { font-size: 16px; margin: 0; line-height: 1.4; font-weight: 600; }
        
        /* 로딩 애니메이션 */
        .loading { text-align: center; padding: 30px; color: #666; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="mainTitle">🌱 오늘의 기후·에너지</h1>
        
        <div class="update-time">
            <span id="updateTime">업데이트: 데이터를 불러오는 중...</span>
        </div>

        <!-- 🔍 검색창 & 새로고침 컨트롤러 추가 -->
        <div class="search-container">
            <input type="text" id="keywordInput" class="search-input" placeholder="추가 검색어 입력 (예: 제주풍력, RE100)" onkeypress="if(event.keyCode==13) fetchLiveNews()">
            <button class="action-btn" onclick="fetchLiveNews()">검색</button>
            <button class="action-btn refresh-btn" onclick="fetchLiveNews(true)">🔄 실시간 갱신</button>
        </div>
        
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterGroup('주요', this)">주요 뉴스 (기본)</button>
            <button class="filter-btn" onclick="filterGroup('제주 언론', this)">제주 언론</button>
            <button class="filter-btn" onclick="filterGroup('중앙지', this)">중앙 10개지</button>
            <button class="filter-btn" onclick="filterGroup('기타', this)">기타</button>
        </div>

        <div id="newsList"></div>
    </div>

    <script>
        let allArticles = [];
        
        // 언론사 분류 사전 (자바스크립트용)
        const TARGET_NATIONAL = ["조선일보", "중앙일보", "동아일보", "한겨레", "경향신문", "한국일보", "서울신문", "문화일보", "세계일보", "국민일보"];
        const TARGET_JEJU = ["제주의소리", "헤드라인제주", "한라일보", "제민일보", "제주매일", "JIBS"];

        function categorizeSource(sourceName) {
            if (TARGET_JEJU.some(j => sourceName.includes(j))) return { group: "제주 언론", priority: 1 };
            if (TARGET_NATIONAL.some(n => sourceName.includes(n))) return { group: "중앙지", priority: 2 };
            return { group: "기타", priority: 3 };
        }

        // 1. 처음 접속 시 8시 고정 데이터(data.json) 불러오기
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('mainTitle').innerText = `🌱 오늘의 기후·에너지 (${data.today_date})`;
                document.getElementById('updateTime').innerText = `업데이트: ${data.update_time} (조간)`;
                allArticles = data.articles;
                filterGroup('주요', document.querySelector('.filter-btn.active'));
            })
            .catch(error => console.log('로컬 데이터를 기다립니다.'));

        // 2. 실시간 구글 뉴스 다이렉트 호출 함수 (검색 및 새로고침)
        function fetchLiveNews(isRefresh = false) {
            const newsList = document.getElementById('newsList');
            newsList.innerHTML = '<div class="loading">실시간 기사를 수집하고 있습니다... ⏳</div>';

            // 입력된 키워드가 없으면 기본 키워드로, 있으면 입력된 키워드로 세팅
            let customKeyword = document.getElementById('keywordInput').value.trim();
            let baseKeywords = "기후 OR 에너지 OR 전력시장 OR 전력계통 OR 탄소시장 OR 탄소크레딧 OR 해상풍력 OR 태양광";
            
            // 단순 새로고침 버튼을 누른 거면 기본 키워드 사용
            let finalQuery = (customKeyword && !isRefresh) ? customKeyword : baseKeywords;
            if(isRefresh) document.getElementById('keywordInput').value = ''; // 갱신 시 검색창 초기화

            const query = encodeURIComponent(finalQuery + " when:1d");
            const rssUrl = `https://news.google.com/rss/search?q=${query}&hl=ko&gl=KR&ceid=KR:ko`;
            
            // 웹페이지가 다른 사이트(구글) 데이터를 직접 가져오려면 우회로(CORS Proxy)가 필요합니다.
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`;

            fetch(proxyUrl)
                .then(response => response.text())
                .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
                .then(data => {
                    const items = data.querySelectorAll("item");
                    let liveArticles = [];
                    
                    items.forEach(item => {
                        const titleRaw = item.querySelector("title").textContent;
                        const link = item.querySelector("link").textContent;
                        
                        let source = "기타 언론사";
                        const sourceNode = item.querySelector("source");
                        if(sourceNode) { source = sourceNode.textContent; }

                        // 제목 끝에 붙은 언론사 이름 제거
                        const titleParts = titleRaw.split(' - ');
                        if(!sourceNode && titleParts.length > 1) { source = titleParts.pop(); }
                        const cleanTitle = titleParts.join(' - ');

                        const cat = categorizeSource(source);

                        liveArticles.push({
                            title: cleanTitle,
                            link: link,
                            source: source,
                            group: cat.group,
                            priority: cat.priority
                        });
                    });

                    // 1:제주 -> 2:중앙 -> 3:기타 순서로 정렬
                    liveArticles.sort((a, b) => a.priority - b.priority);
                    allArticles = liveArticles;

                    // 업데이트 시간 텍스트 변경
                    const now = new Date();
                    const timeString = `${now.getMonth()+1}월 ${now.getDate()}일 ${now.getHours()}시 ${now.getMinutes()}분`;
                    document.getElementById('updateTime').innerHTML = `<span style="color:#d32f2f; font-weight:bold;">실시간 반영 완료: ${timeString}</span>`;

                    // 제목도 검색어에 맞게 변경
                    if(customKeyword && !isRefresh) {
                        document.getElementById('mainTitle').innerText = `🔍 검색 결과: ${customKeyword}`;
                    } else {
                        document.getElementById('mainTitle').innerText = `🌱 오늘의 기후·에너지 (${now.getMonth()+1}월 ${now.getDate()}일)`;
                    }

                    // 화면에 그리기 (주요 뉴스 탭으로 초기화)
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    document.querySelector('.filter-container button').classList.add('active');
                    filterGroup('주요', document.querySelector('.filter-btn.active'));
                })
                .catch(error => {
                    newsList.innerHTML = '<p style="color:red; text-align:center;">실시간 수집에 실패했습니다. 잠시 후 다시 시도해주세요.</p>';
                });
        }

        // 3. 탭 버튼 클릭 시 화면 그리기
        function renderNews(articles) {
            const newsList = document.getElementById('newsList');
            let html = '';
            
            if (articles.length === 0) {
                newsList.innerHTML = '<p style="color:#666; text-align:center; padding:20px;">해당 조건의 기사가 없습니다.</p>';
                return;
            }

            articles.forEach(article => {
                let badgeClass = 'badge-other';
                if (article.group === '제주 언론') badgeClass = 'badge-jeju';
                else if (article.group === '중앙지') badgeClass = 'badge-national';

                html += `
                    <a href="${article.link}" target="_blank" class="news-card">
                        <span class="source-badge ${badgeClass}">${article.source}</span>
                        <h3 class="news-title">${article.title}</h3>
                    </a>
                `;
            });
            newsList.innerHTML = html;
        }

        function filterGroup(targetGroup, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            let filtered = [];
            if (targetGroup === '주요') {
                filtered = allArticles.filter(a => a.group === '제주 언론' || a.group === '중앙지');
            } else {
                filtered = allArticles.filter(a => a.group === targetGroup);
            }
            renderNews(filtered);
        }
    </script>
</body>
</html>
