<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기후·에너지 일일 동향 파악</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    h1 { margin: 0; font-size: 24px; color: #1a237e; }
    select { padding: 8px 12px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; outline: none; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
    .outlet-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-top: 4px solid #1a73e8; }
    .outlet-name { font-size: 18px; font-weight: bold; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    .news-list { list-style: none; padding: 0; margin: 0; }
    .news-list li { margin-bottom: 10px; line-height: 1.4; }
    .news-list a { color: #2c3e50; text-decoration: none; font-size: 14px; }
    .news-list a:hover { color: #1a73e8; text-decoration: underline; }
    .empty { color: #999; font-size: 14px; font-style: italic; }
    .loading { text-align: center; padding: 50px; font-size: 16px; color: #666; line-height: 1.6; }
    .count { font-size: 14px; color: #888; font-weight: normal; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🌍 기후/에너지 일일 동향</h1>
      <select id="date-select" onchange="renderDashboard()">
        <option value="">데이터 불러오는 중...</option>
      </select>
    </div>
    <div id="dashboard" class="grid">
      <div class="loading">동향 데이터를 가져오고 있습니다...</div>
    </div>
  </div>

  <script>
    // 질문자님의 구글 앱스 스크립트 주소를 완벽하게 삽입했습니다.
    const API_URL = "https://script.google.com/macros/s/AKfycbyeogQGMCcRQ091pRMdx-1re-fYwpWv51WBgUvxRpkJ9fIVN8ZMo9OYMR_xjimAtB8R/exec"; 
    
    const MEDIA_LIST = [
      "조선일보", "중앙일보", "동아일보", "한겨레", "경향신문", "한국일보", 
      "서울신문", "문화일보", "세계일보", "국민일보", "제주의소리", "헤드라인제주", 
      "한라일보", "제민일보", "제주매일", "JIBS", "에너지경제신문", "전기신문"
    ];

    let allNewsData = [];

    // 오류를 더 잘 잡아내도록 통신 코드 업데이트
    fetch(API_URL, { redirect: "follow" })
      .then(res => res.json())
      .then(data => {
        allNewsData = data;
        setupDateSelector();
        renderDashboard(); 
      })
      .catch(err => {
        // 오류가 날 경우 화면에 구체적인 해결책을 띄워줍니다.
        document.getElementById('dashboard').innerHTML = `
          <div class="loading">
            <b>데이터를 불러오지 못했습니다 😢</b><br><br>
            1. 구글 스프레드시트 엑셀 화면에 뉴스가 정상적으로 채워져 있는지 확인해주세요.<br>
            2. 크롬에 구글 계정이 여러 개 로그인되어 있으면 충돌이 납니다. 브라우저 <b>'새 시크릿 창'</b>을 열고 접속해보세요.
          </div>
        `;
      });

    function setupDateSelector() {
      const dates = [...new Set(allNewsData.map(item => item.date))].sort().reverse(); 
      const select = document.getElementById('date-select');
      
      if (dates.length === 0) {
        select.innerHTML = '<option value="">저장된 기록 없음</option>';
        return;
      }
      select.innerHTML = dates.map(date => `<option value="${date}">${date} 동향</option>`).join('');
    }

    function renderDashboard() {
      const selectedDate = document.getElementById('date-select').value;
      if (!selectedDate) {
        document.getElementById('dashboard').innerHTML = '<div class="loading">수집된 기사가 없습니다.</div>';
        return;
      }

      const dateNews = allNewsData.filter(item => item.date === selectedDate);
      let html = '';

      MEDIA_LIST.forEach(media => {
        const mediaArticles = dateNews.filter(news => news.source === media);
        
        html += `
          <div class="outlet-card">
            <div class="outlet-name">
              ${media} <span class="count">${mediaArticles.length}건</span>
            </div>
            <ul class="news-list">
        `;

        if (mediaArticles.length > 0) {
          mediaArticles.forEach(article => {
            html += `<li><a href="${article.link}" target="_blank">▪ ${article.title}</a></li>`;
          });
        } else {
          html += `<div class="empty">해당없음</div>`;
        }

        html += `</ul></div>`;
      });

      document.getElementById('dashboard').innerHTML = html;
    }
  </script>
</body>
</html>
