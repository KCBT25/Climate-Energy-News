<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기후·에너지 뉴스 클리핑</title>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #1e4a3c; margin-bottom: 5px; font-size: 24px; }
        .update-time { font-size: 13px; color: #666; margin-bottom: 20px; }
        
        /* 언론사 필터 버튼 스타일 */
        .filter-container { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 20px; padding-bottom: 10px; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-btn { background: #e0e7e4; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; color: #333; }
        .filter-btn.active { background: #1e4a3c; color: white; font-weight: bold; }
        
        /* 기사 리스트 스타일 */
        .news-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0무,0,0.05); text-decoration: none; display: block; color: inherit; transition: transform 0.2s; }
        .news-card:active { transform: scale(0.98); }
        .source { font-size: 12px; color: #007aff; font-weight: bold; margin-bottom: 6px; }
        .news-title { font-size: 16px; margin: 0; line-height: 1.4; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 오늘의 기후·에너지</h1>
        <div id="updateTime" class="update-time">업데이트 시간을 불러오는 중...</div>
        
        <div id="filterContainer" class="filter-container">
            <!-- 필터 버튼이 자바스크립트에 의해 생성됩니다 -->
        </div>

        <div id="newsList">
            <!-- 기사 목록이 여기에 생성됩니다 -->
        </div>
    </div>

    <script>
        let allArticles = [];

        // 1. 저장된 JSON 데이터 불러오기 (새로고침 없이 비동기로)
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('updateTime').innerText = `업데이트 시간: ${data.update_time}`;
                allArticles = data.articles;
                
                renderFilters(allArticles);
                renderNews(allArticles);
            })
            .catch(error => {
                document.getElementById('newsList').innerHTML = '<p>기사를 불러오지 못했습니다.</p>';
            });

        // 2. 언론사 필터 버튼 만들기
        function renderFilters(articles) {
            const filterContainer = document.getElementById('filterContainer');
            // 중복 없는 언론사 목록 추출
            const sources = [...new Set(articles.map(article => article.source))];
            
            // '전체보기' 버튼 추가
            let buttonsHtml = `<button class="filter-btn active" onclick="filterNews('전체', this)">전체보기</button>`;
            
            sources.forEach(source => {
                buttonsHtml += `<button class="filter-btn" onclick="filterNews('${source}', this)">${source}</button>`;
            });
            filterContainer.innerHTML = buttonsHtml;
        }

        // 3. 기사 화면에 그리기
        function renderNews(articles) {
            const newsList = document.getElementById('newsList');
            let html = '';
            
            articles.forEach(article => {
                // 원본 기사로 넘어가는 아웃링크 적용
                html += `
                    <a href="${article.link}" target="_blank" class="news-card">
                        <div class="source">${article.source}</div>
                        <h3 class="news-title">${article.title}</h3>
                    </a>
                `;
            });
            newsList.innerHTML = html;
        }

        // 4. 언론사 클릭 시 화면 깜빡임 없이 리스트 바꾸기
        function filterNews(source, btnElement) {
            // 버튼 색상 변경
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            // 기사 필터링
            if (source === '전체') {
                renderNews(allArticles);
            } else {
                const filtered = allArticles.filter(article => article.source === source);
                renderNews(filtered);
            }
        }
    </script>
</body>
</html>
